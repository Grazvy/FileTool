<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>File Tool</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <h1>File Tool</h1>
    <p class="tagline">Local file conversion. Nothing leaves this machine.</p>
  </header>

  <main class="layout">
    <section class="panel" id="input-panel">
      <h2>Input</h2>
      <label class="dropzone" id="dropzone" for="file-input">
        <span class="dropzone-title">Drop a file here or click to choose</span>
        <span class="dropzone-hint">PDF, PNG or JPG</span>
        <input type="file" id="file-input" accept=".pdf,.png,.jpg,.jpeg,application/pdf,image/png,image/jpeg" hidden>
      </label>
      <p class="file-meta" id="file-meta" hidden></p>
      <p class="message" id="message" hidden></p>
    </section>

    <section class="panel" id="pdf-panel" hidden>
      <h2>Pages</h2>
      <p class="panel-hint">Use &minus; to mark a page for removal, then apply the changes.</p>
      <div class="page-list" id="page-list"></div>
      <div class="actions">
        <button type="button" class="primary" id="apply-button" disabled>Apply changes</button>
        <span class="action-note" id="pdf-note"></span>
      </div>
    </section>

    <section class="panel" id="convert-panel" hidden>
      <h2>Convert</h2>
      <div class="image-preview"><img id="image-preview" alt="Preview of the selected image"></div>
      <fieldset class="targets">
        <legend>Convert to</legend>
        <div id="target-options"></div>
      </fieldset>
      <div class="actions">
        <button type="button" class="primary" id="convert-button" disabled>Convert</button>
      </div>
    </section>

    <section class="panel" id="result-panel" hidden>
      <h2>Result</h2>
      <p class="file-meta" id="result-meta"></p>
      <div class="actions">
        <button type="button" class="primary" id="download-button" disabled>Download</button>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
