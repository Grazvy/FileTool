<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Tool</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>File Tool</h1>
            <p>Select files to prepare your next operation</p>
        </header>

        <main>
            <section class="file-input-module" aria-label="File input and overview">
                <div class="file-input-actions">
                    <button id="remove-selected-btn" class="remove-btn" type="button" disabled>
                        Remove
                    </button>
                </div>

                <div id="file-strip" class="file-strip" aria-label="File dropzone" tabindex="0">
                    <div id="file-items" class="file-items" role="list"></div>
                </div>

                <input id="file-picker" class="hidden-file-input" type="file" multiple>
            </section>
            <div class="helper-text">
                Drag files into the strip or use the plus button to add files.
            </div>
        </main>
    </div>

    <script src="config.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
